[project]
name = "codepilot-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic",
  "python-dotenv",
  "langchain",
  "langchain-core",
  "langchain-text-splitters",
  "langchain-aws",
  "langchain-groq",
  "langchain-community",
  "langgraph",
  "chromadb",
  "supabase",
  "fastembed",
  "bedrock-agentcore",
  "aws-opentelemetry-distro>=0.20.0"
]
[tool.agentcore]
entrypoint = "agentcore_runtime.py"
