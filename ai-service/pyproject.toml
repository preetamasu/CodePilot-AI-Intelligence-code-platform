[project]
name = "codepilot-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-dotenv",

  "langchain",
  "langchain-core",
  "langchain-text-splitters",
  "langchain-aws",
  "langgraph",

  "chromadb",
  "supabase",
  "bedrock-agentcore"
]

[tool.agentcore]
entrypoint = "agentcore_runtime.py"
